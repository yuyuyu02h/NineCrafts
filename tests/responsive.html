<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NineCrafts 操作・画面幅の確認</title>
<style>
  body { margin: 0; padding: 8px; background: #303030; color: white; font: 14px system-ui; }
  nav { display: flex; gap: 8px; margin-bottom: 8px; }
  button { min-height: 44px; padding: 4px 12px; }
  iframe { display: block; border: 1px solid #777; width: 390px; height: 640px; margin: auto; }
</style>
<nav aria-label="検証画面サイズ">
  <button onclick="size(390,640)">縦 390×640</button>
  <button onclick="size(844,390)">横 844×390</button>
  <button onclick="size(640,360)">横 640×360</button>
  <span>ゲーム開始前に「タッチ操作」をONにしてください。開発用の手動検証ページです。</span>
</nav>
<iframe title="検証用ゲーム" src="/"></iframe>
<script>
  function size(width, height) {
    const frame = document.querySelector('iframe');
    frame.style.width = width + 'px'; frame.style.height = height + 'px';
  }
</script>
</html>
